name: Deploy public dashboard

on:
  push:
    branches: [main]
    paths:
      - public/**
      - .github/workflows/deploy-dashboard.yml
  workflow_dispatch:

# The workflow can read this repository and publish only the public/ artifact.
# It never receives database credentials and never runs the private pipeline.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out public artifact
        uses: actions/checkout@v6
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload public dashboard
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
